name: Train self-learning 2048 AI

on:
  # Training is deliberately manual: code pushes and model commits must not
  # unexpectedly consume hours of runner time.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: selfplay-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests/test_selfplay.py

      - name: Recover the checkpoint from the interrupted training run
        if: hashFiles('models/selfplay/latest.npz') == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p models/selfplay
          echo "No committed checkpoint found; recovering the saved checkpoint from the previous run artifact."
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.name == "self-learning-2048-trained-model" and .expired == false) | .id' | head -n 1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No unexpired self-learning model artifact is available to recover."
            exit 1
          fi
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/selfplay-recovery.zip
          unzip -o /tmp/selfplay-recovery.zip -d models/selfplay
          test -s models/selfplay/latest.npz
          test -s models/selfplay/best.npz
          test -s models/selfplay/training.csv
          echo "Recovered checkpoint files:"
          ls -lh models/selfplay/latest.npz models/selfplay/best.npz models/selfplay/training.csv

      - name: Train or resume for 10,000 additional games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/selfplay
          TRAIN_ARGS=(--games 10000 --depth 1 --workers 0 --eval-every 1000 --eval-games 50 --eval-depths 1 2 3 4 --eval-depth 2 --log-every 100 --out models/selfplay)
          echo "Training for 10,000 additional games from the latest saved checkpoint."
          if [ -s models/selfplay/latest.npz ]; then
            python main.py train "${TRAIN_ARGS[@]}" --resume models/selfplay/latest.npz --resume-metrics
          else
            python main.py train "${TRAIN_ARGS[@]}"
          fi

      - name: Evaluate best learned checkpoint
        run: >-
          python main.py evaluate
          --model models/selfplay/best.npz
          --games 100
          --depth 1
          --seed 3000000

      - name: Benchmark search depths on the same fixed seeds
        run: >-
          python main.py benchmark
          --model models/selfplay/best.npz
          --games 10
          --depths 1 2
          --seed 4000000

      - name: Upload trained model and training metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-learning-2048-trained-model
          path: |
            models/selfplay/*.npz
            models/selfplay/training.csv
            models/selfplay/evaluation.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Commit trained checkpoints to the current branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add models/selfplay/
          git commit -m "Update trained self-learning 2048 model" || echo "No model changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
