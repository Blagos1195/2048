name: Slow-epsilon self-play training

on:
  push:
    paths:
      - ".github/workflows/train-selfplay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore previous training checkpoints
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41682288002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/adaptive-exploration
      - name: Download benchmark checkpoints
        uses: actions/download-artifact@v4
        with:
          name: overnight-ai-training
          run-id: 41543278670
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/original
      - name: Download previous slow-epsilon checkpoint
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41619096347
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/pre-today
      - name: Download current pre-training checkpoint
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41682288002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/current
      - name: Benchmark all models on identical seeds
        run: |
          find benchmarks -name best.npz -o -name latest.npz
                    original_model="$(find benchmarks/original -name best.npz -print -quit)"
          previous_model="$(find benchmarks/pre-today -name best.npz -print -quit)"
          current_model="$(find benchmarks/current -name best.npz -print -quit)"
          test -n "$original_model" && test -n "$previous_model" && test -n "$current_model"
          python main.py benchmark --model "$original_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/original-results.csv
          python main.py benchmark --model "$previous_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/pre-today-results.csv
          python main.py benchmark --model "$current_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/current-results.csv
      - name: Continue training for 5 hours 45 minutes
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=90s 20700s python main.py train \
            --games 10000000 \
            --depth 2 \
            --epsilon 0.06 \
            --min-epsilon 0.06 \
            --epsilon-decay 1.0 \
            --late-epsilon 0.15 \
            --late-tile-threshold 1024 \
            --eval-every 1000 \
            --eval-games 50 \
            --eval-depths 1 2 \
            --extended-eval-every 5000 \
            --extended-eval-games 20 \
            --extended-eval-depths 3 \
            --eval-depth 2 \
            --log-every 25 \
            --workers 0 \
            --resume models/adaptive-exploration/latest.npz \
            --resume-metrics \
            --out models/adaptive-exploration
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Final evaluation of best checkpoint
        if: always()
        run: |
          if [ -f models/adaptive-exploration/best.npz ]; then
            python main.py evaluate \
              --model models/adaptive-exploration/best.npz \
              --games 100 \
              --depth 2 \
              --workers 0
          else
            echo "No best checkpoint was produced."
          fi
      - name: Save training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          path: models/adaptive-exploration/
          if-no-files-found: warn
          retention-days: 30
