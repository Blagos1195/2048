name: Self-play AI tests

on:
  push:
    branches: [main, self-learning-final]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py selfplay_ai.py selfplay_ui.py
      - run: python -c "import selfplay_ui"
      - run: python -m pytest -q tests/test_selfplay.py
      - name: Smoke-test shared-memory parallel training through main.py
        run: python main.py train --games 4 --workers 2 --eval-every 0 --log-every 1 --out /tmp/selfplay-parallel-smoke
      - name: Benchmark old versus optimised evaluation speed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/selfplay-model /tmp/selfplay-before
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13057985574/zip" \
            -o /tmp/selfplay-model.zip
          unzip -o /tmp/selfplay-model.zip -d /tmp/selfplay-model
          MODEL=/tmp/selfplay-model/latest.npz
          test -s "$MODEL"
          git show e3b8103baaa10e8752eaf039f9f9533451c1f7bb:selfplay_ai.py > /tmp/selfplay-before/selfplay_ai.py
          git show e3b8103baaa10e8752eaf039f9f9533451c1f7bb:main.py > /tmp/selfplay-before/main.py
          echo "=== BEFORE OPTIMISATION ==="
          (cd /tmp/selfplay-before && python main.py evaluate --model "$MODEL" --games 20 --depth 2 --seed 5200000 --workers 1) | tee /tmp/before.txt
          echo "=== AFTER OPTIMISATION ==="
          python main.py evaluate --model "$MODEL" --games 20 --depth 2 --seed 5200000 --workers 1 | tee /tmp/after.txt
          echo "=== COMPARISON ==="
          python - <<'PY'
          import re
          def read(path):
              text = open(path).read()
              values = {}
              for key in ("seconds", "avg_moves", "games_per_second"):
                  match = re.search(rf"^{key}: ([0-9.eE+-]+)", text, re.M)
                  if not match:
                      raise SystemExit(f"Missing {key} in {path}")
                  values[key] = float(match.group(1))
              values["ms_per_move"] = values["seconds"] * 1000 / (20 * values["avg_moves"])
              return values
          before, after = read("/tmp/before.txt"), read("/tmp/after.txt")
          change = (after["ms_per_move"] / before["ms_per_move"] - 1) * 100
          print(f"Before: {before['ms_per_move']:.3f} ms/move")
          print(f"After:  {after['ms_per_move']:.3f} ms/move")
          print(f"Change: {change:+.1f}% (negative is faster)")
          PY

      - name: Profile Expectimax search hotspots\n        run: python profile_search.py --model /tmp/selfplay-model/latest.npz --depth 2 --seed 5200000 --moves 40\n\n      - name: Isolate the two pattern-indexing optimisations
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/tmp/selfplay-model/latest.npz
          for variant in old_both old_exponent old_pattern optimised_both; do
            echo "Running $variant"
            python - "$variant" "$MODEL" > "/tmp/$variant.txt" <<'PY'
          import runpy, sys
          import numpy as np
          import selfplay_ai as ai

          variant, model = sys.argv[1], sys.argv[2]

          def old_exponent_board(board):
              board = np.asarray(board, dtype=np.int64)
              out = np.zeros(board.shape, dtype=np.uint8)
              mask = board > 0
              out[mask] = np.minimum(
                  np.rint(np.log2(board[mask])).astype(np.int64),
                  ai.TILE_EXPONENT_CAP,
              )
              return out

          def old_pattern_indices(board):
              exponents = ai.exponent_board(board).reshape(-1)
              result = np.empty(ai.PATTERN_COUNT, dtype=np.int32)
              for p, cells in enumerate(ai.PATTERNS):
                  idx = 0
                  for cell in cells:
                      idx = idx * ai.BASE + int(exponents[cell])
                  result[p] = idx
              return result

          if variant in ("old_both", "old_exponent"):
              ai.exponent_board = old_exponent_board
          if variant in ("old_both", "old_pattern"):
              ai.pattern_indices = old_pattern_indices

          sys.argv = [
              "main.py", "evaluate", "--model", model,
              "--games", "5", "--depth", "2",
              "--seed", "5200000", "--workers", "1",
          ]
          runpy.run_module("main", run_name="__main__")
          PY
          done
          python - <<'PY'
          import re
          names = ("old_both", "old_exponent", "old_pattern", "optimised_both")
          results = {}
          for name in names:
              data = open(f"/tmp/{name}.txt").read()
              seconds = float(re.search(r"^seconds: ([0-9.eE+-]+)", data, re.M).group(1))
              moves = float(re.search(r"^avg_moves: ([0-9.eE+-]+)", data, re.M).group(1))
              results[name] = seconds * 1000 / (5 * moves)
          baseline = results["old_both"]
          for name in names:
              change = (results[name] / baseline - 1) * 100
              print(f"{name}: {results[name]:.3f} ms/move ({change:+.1f}% vs old)")
          PY
