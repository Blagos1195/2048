name: Self-play tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Smoke-test multi-worker training and checkpoint resume
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_OUT="$RUNNER_TEMP/selfplay-smoke"
          python main.py train --games 4 --workers 2 --eval-every 0 --log-every 1 --out "$SMOKE_OUT"
          python main.py train --games 2 --workers 2 --eval-every 0 --log-every 1 \
            --resume "$SMOKE_OUT/latest.npz" --out "$SMOKE_OUT"

      - name: Compare fixed-seed performance against main
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add "$RUNNER_TEMP/baseline" origin/main
          MODEL="$GITHUB_WORKSPACE/models/selfplay/best.npz"
          (
            cd "$RUNNER_TEMP/baseline"
            python -c "from selfplay_ai import Game2048, NTupleValue; board=Game2048(1).board; NTupleValue().expected_spawn_value(board)"
            python main.py benchmark --model "$MODEL" --games 5 --depths 1 2 --seed 4200200 --output "$RUNNER_TEMP/baseline.csv"
          )
          python -c "from selfplay_ai import Game2048, NTupleValue; board=Game2048(1).board; NTupleValue().expected_spawn_value(board)"
          python main.py benchmark --model "$MODEL" --games 5 --depths 1 2 --seed 4200200 --output "$RUNNER_TEMP/candidate.csv"
          python - "$RUNNER_TEMP/baseline.csv" "$RUNNER_TEMP/candidate.csv" <<'PY'
          import csv
          import sys

          def read(path):
              with open(path, newline="", encoding="utf-8") as file:
                  return {int(row["depth"]): row for row in csv.DictReader(file)}

          baseline, candidate = map(read, sys.argv[1:])
          for depth in sorted(baseline):
              old, new = baseline[depth], candidate[depth]
              old_time, new_time = float(old["seconds"]), float(new["seconds"])
              print(
                  f"depth={depth} baseline={old_time:.3f}s candidate={new_time:.3f}s "
                  f"runtime_change={(new_time / old_time - 1) * 100:+.1f}% "
                  f"score={float(old['avg_score']):.1f}->{float(new['avg_score']):.1f} "
                  f"2048_rate={float(old['rate_2048']):.1%}->{float(new['rate_2048']):.1%}"
              )
          PY

      - name: Upload fixed-seed comparison
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 7
        uses: actions/upload-artifact@v4
        with:
          name: numba-can-move-comparison
          path: |
            ${{ runner.temp }}/baseline.csv
            ${{ runner.temp }}/candidate.csv
          if-no-files-found: warn

