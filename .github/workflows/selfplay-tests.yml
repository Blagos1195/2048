name: Self-play AI tests

on:
  push:
    branches: [self-learning-final]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-selfplay.txt
      - run: python -m pytest -q tests/test_selfplay.py
