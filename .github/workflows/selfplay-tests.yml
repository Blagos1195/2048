name: Self-play AI tests

on:
  push:
    branches: [main, self-learning-final]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py selfplay_ai.py selfplay_ui.py profile_search.py diagnose_search.py
      - run: python -c "import selfplay_ui"
      - run: python -m pytest -q tests/test_selfplay.py
      - name: Smoke-test shared-memory parallel training through main.py
        run: python main.py train --games 4 --workers 2 --eval-every 0 --log-every 1 --out /tmp/selfplay-parallel-smoke
      - name: Diagnose depth 3 search branching on one game
        timeout-minutes: 10
        run: python diagnose_search.py --model /tmp/selfplay-model/latest.npz --depth 3 --seed 5200000 --moves 3

      - name: Profile Expectimax search hotspots
        run: python profile_search.py --model /tmp/selfplay-model/latest.npz --depth 2 --seed 5200000 --moves 40

      - name: Benchmark the browser Pyodide engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/browser-bench
          cp browser_benchmark.html selfplay_ai.py /tmp/browser-bench/
          cp /tmp/selfplay-model/latest.npz /tmp/browser-bench/best.npz
          python -m http.server 8765 --directory /tmp/browser-bench >/tmp/browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npm install --no-save playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          page.setDefaultTimeout(120000);
          await page.goto("http://127.0.0.1:8765/browser_benchmark.html");
          await page.waitForFunction(() => {
            const result = document.querySelector("#result");
            return result?.dataset.complete === "true" || result?.dataset.complete === "error";
          }, null, { timeout: 180000 });
          const result = await page.locator("#result").textContent();
          console.log("=== BROWSER PYODIDE BENCHMARK ===");
          console.log(result);
          if (!result || result.includes('"moves": 0')) {
            await browser.close();
            throw new Error("Browser benchmark did not complete any moves");
          }
          await browser.close();
          JS

      - name: Isolate the two pattern-indexing optimisations
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/tmp/selfplay-model/latest.npz
          for variant in old_both old_exponent old_pattern optimised_both; do
            echo "Running $variant"
            python - "$variant" "$MODEL" > "/tmp/$variant.txt" <<'PY'
          import runpy, sys
          import numpy as np
          import selfplay_ai as ai

          variant, model = sys.argv[1], sys.argv[2]

          def old_exponent_board(board):
              board = np.asarray(board, dtype=np.int64)
              out = np.zeros(board.shape, dtype=np.uint8)
              mask = board > 0
              out[mask] = np.minimum(
                  np.rint(np.log2(board[mask])).astype(np.int64),
                  ai.TILE_EXPONENT_CAP,
              )
              return out

          def old_pattern_indices(board):
              exponents = ai.exponent_board(board).reshape(-1)
              result = np.empty(ai.PATTERN_COUNT, dtype=np.int32)
              for p, cells in enumerate(ai.PATTERNS):
                  idx = 0
                  for cell in cells:
                      idx = idx * ai.BASE + int(exponents[cell])
                  result[p] = idx
              return result

          if variant in ("old_both", "old_exponent"):
              ai.exponent_board = old_exponent_board
          if variant in ("old_both", "old_pattern"):
              ai.pattern_indices = old_pattern_indices

          sys.argv = [
              "main.py", "evaluate", "--model", model,
              "--games", "5", "--depth", "2",
              "--seed", "5200000", "--workers", "1",
          ]
          runpy.run_module("main", run_name="__main__")
          PY
          done
          python - <<'PY'
          import re
          names = ("old_both", "old_exponent", "old_pattern", "optimised_both")
          results = {}
          for name in names:
              data = open(f"/tmp/{name}.txt").read()
              seconds = float(re.search(r"^seconds: ([0-9.eE+-]+)", data, re.M).group(1))
              moves = float(re.search(r"^avg_moves: ([0-9.eE+-]+)", data, re.M).group(1))
              results[name] = seconds * 1000 / (5 * moves)
          baseline = results["old_both"]
          for name in names:
              change = (results[name] / baseline - 1) * 100
              print(f"{name}: {results[name]:.3f} ms/move ({change:+.1f}% vs old)")
          PY
