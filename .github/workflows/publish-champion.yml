name: Publish champion checkpoint

on:
  push:
    paths:
      - ".github/workflows/publish-champion.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download run27 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41866846302
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: champion
      - name: Install champion as website and app best
        run: |
          test -s champion/best.npz
          cp champion/best.npz models/selfplay/best.npz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/selfplay/best.npz
          if git diff --cached --quiet; then
            echo "Champion checkpoint is already published."
          else
            git commit -m "Publish run27 champion checkpoint"
            git push
          fi
