name: Search-target training experiment

on:
  push:
    paths:
      - ".github/workflows/search-target-training.yml"
  workflow_dispatch:

concurrency:
  group: search-target-training
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Find previous experiment artifact
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "search-target-training.yml",
              branch: "main",
              status: "completed",
              per_page: 20
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              if (artifacts.data.artifacts.some(a => a.name === "search-target-training" && !a.expired)) {
                core.setOutput("run-id", String(run.id));
                return;
              }
            }
            core.setFailed("No previous search-target-training artifact was found.");
      - name: Restore experiment checkpoint and history
        uses: actions/download-artifact@v4
        with:
          name: search-target-training
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/search-target
      - name: Restart experiment from the last known-good checkpoint once
        run: |
          if [ ! -f models/search-target/search-target-fix-v1 ]; then
            cp models/search-target/starting.npz models/search-target/latest.npz
            cp models/search-target/starting.npz models/search-target/best.npz
            rm -f models/search-target/training.csv models/search-target/benchmark.csv
            touch models/search-target/search-target-fix-v1
          fi
      - name: Validate inputs and trainer
        run: |
          test -s models/search-target/latest.npz
          test -s models/search-target/best.npz
          test -s models/search-target/starting.npz
          test -s models/search-target/published-champion.npz
          python -m py_compile selfplay_ai.py tools/train_search_target.py
      - name: Train for 5 hours, reserving 30 minutes for final benchmarks
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=180s 19800s python -u tools/train_search_target.py \
            --resume models/search-target/latest.npz \
            --champion models/search-target/published-champion.npz \
            --out models/search-target \
            --hours 5.0 \
            --workers 0 \
            --target-depth 3 \
            --target-horizon 3 \
            --target-interval 32
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Save experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-target-training
          path: models/search-target/
          if-no-files-found: warn
          retention-days: 30
