name: Policy ordering experiment

on:
  push:
    branches:
      - main
      - policy-ordering-experiment
    paths:
      - ".github/workflows/policy-ordering-experiment.yml"
      - "policy_ordering_ai.py"
      - "tools/train_policy_ordering.py"

permissions:
  contents: read
  actions: read

jobs:
  train-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore teacher model
        uses: actions/download-artifact@v4
        with:
          name: search-target-training
          run-id: 42387625321
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: models/restored-search-target
      - name: Verify and train
        run: |
          test -s models/restored-search-target/latest.npz
          python -m py_compile selfplay_ai.py policy_ordering_ai.py tools/train_policy_ordering.py
          python -u tools/train_policy_ordering.py
      - name: Save experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-ordering-experiment
          path: models/policy-ordering/
          if-no-files-found: warn
          retention-days: 90
