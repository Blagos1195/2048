name: Depth 1 performance benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out benchmark runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve benchmark script
        run: cp benchmarks/benchmark_depth1.py /tmp/benchmark_depth1.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy

      - name: Benchmark recent commits
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            2623b9e0a29a1daaef2f2ae0aee9956b3fabcaaa
            1d7dc1dad5079f7924d22017f3c86fc5a313f617
            36ccf30897076f1071e679b10f3b50456c8940e7
            205ef222cd7f39f4c6c1b535121d2902d99ee106
            9152f6169807f9ded7222a803583fce92c0f3b83
            0e23de6c2253c540633643c9d30d77525a1acf82
          )
          mkdir -p benchmark-results
          for sha in "${commits[@]}"; do
            echo "===== $sha ====="
            git checkout --detach "$sha"
            PYTHONPATH="$PWD" python /tmp/benchmark_depth1.py | tee -a benchmark-results/results.txt
          done
          git checkout main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: depth1-benchmark-results
          path: benchmark-results/results.txt
          if-no-files-found: error
