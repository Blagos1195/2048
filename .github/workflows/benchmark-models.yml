name: Matched model benchmarks

on:
  push:
    paths:
      - ".github/workflows/benchmark-models.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download original model
        uses: actions/download-artifact@v4
        with:
          name: overnight-ai-training
          run-id: 41543278670
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/original
      - name: Download run 26 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41796787691
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/run26
      - name: Benchmark original, latest and best on identical seeds
        run: |
          original_model="$(find benchmarks/original -name best.npz -print -quit)"
          if [ -z "$original_model" ]; then
            original_model="$(find benchmarks/original -name latest.npz -print -quit)"
          fi
          latest_model="$(find benchmarks/run26 -name latest.npz -print -quit)"
          best_model="$(find benchmarks/run26 -name best.npz -print -quit)"
          test -n "$original_model"
          test -n "$latest_model"
          test -n "$best_model"
          printf 'Original: %s\nLatest: %s\nBest: %s\n' "$original_model" "$latest_model" "$best_model"
          python main.py benchmark --model "$original_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/original-results.csv
          python main.py benchmark --model "$latest_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/latest-results.csv
          python main.py benchmark --model "$best_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/best-results.csv
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-best-original-benchmarks
          path: benchmarks/
          if-no-files-found: warn
          retention-days: 30
