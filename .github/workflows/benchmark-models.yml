name: Matched model benchmarks

on:
  push:
    paths:
      - ".github/workflows/benchmark-models.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download run 27 champion
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41866846302
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/run27
      - name: Download run 28 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41931505280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/run28
      - name: Benchmark run 27 best and run 28 checkpoints over 500 depth-2 games
        run: |
          run27_best="$(find benchmarks/run27 -name best.npz -print -quit)"
          run28_latest="$(find benchmarks/run28 -name latest.npz -print -quit)"
          run28_best="$(find benchmarks/run28 -name best.npz -print -quit)"
          test -n "$run27_best"
          test -n "$run28_latest"
          test -n "$run28_best"
          printf 'Run 27 best: %s\\nRun 28 latest: %s\\nRun 28 best: %s\\n' "$run27_best" "$run28_latest" "$run28_best"
          python main.py benchmark --model "$run27_best" --games 500 --depths 2 --seed 9000000 --output benchmarks/run27-best-results.csv
          python main.py benchmark --model "$run28_latest" --games 500 --depths 2 --seed 9000000 --output benchmarks/run28-latest-results.csv
          python main.py benchmark --model "$run28_best" --games 500 --depths 2 --seed 9000000 --output benchmarks/run28-best-results.csv
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run28-500-game-checkpoint-comparison
          path: benchmarks/
          if-no-files-found: warn
          retention-days: 30
