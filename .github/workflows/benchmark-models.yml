name: Matched model benchmarks

on:
  push:
    paths:
      - ".github/workflows/benchmark-models.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download run 26 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41796787691
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/run26
      - name: Compare latest and best over 1,000 depth-2 games
        run: |
          latest_model="$(find benchmarks/run26 -name latest.npz -print -quit)"
          best_model="$(find benchmarks/run26 -name best.npz -print -quit)"
          test -n "$latest_model"
          test -n "$best_model"
          printf 'Latest: %s\\nBest: %s\\n' "$latest_model" "$best_model"
          python main.py benchmark --model "$latest_model" --games 1000 --depths 2 --seed 7000000 --output benchmarks/latest-results.csv
          python main.py benchmark --model "$best_model" --games 1000 --depths 2 --seed 7000000 --output benchmarks/best-results.csv
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run26-1000-game-checkpoint-comparison
          path: benchmarks/
          if-no-files-found: warn
          retention-days: 30
