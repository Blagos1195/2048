name: Matched model benchmarks

on:
  push:
    paths:
      - ".github/workflows/benchmark-models.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download original model
        uses: actions/download-artifact@v4
        with:
          name: overnight-ai-training
          run-id: 41543278670
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/original
      - name: Download slow-epsilon run 20 model
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41619096347
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/run20
      - name: Download slow-epsilon run 22 model
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41682288002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/run22
      - name: Download adaptive-exploration model
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41737416456
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmarks/adaptive
      - name: Benchmark all models on identical seeds
        run: |
          find_model() {
            local folder="$1"
            local model
            model="$(find "$folder" -name best.npz -print -quit)"
            if [ -z "$model" ]; then
              model="$(find "$folder" -name latest.npz -print -quit)"
            fi
            test -n "$model"
            printf '%s' "$model"
          }
          original_model="$(find_model benchmarks/original)"
          run20_model="$(find_model benchmarks/run20)"
          run22_model="$(find_model benchmarks/run22)"
          adaptive_model="$(find_model benchmarks/adaptive)"
          printf 'Original: %s\nRun 20: %s\nRun 22: %s\nAdaptive: %s\n' "$original_model" "$run20_model" "$run22_model" "$adaptive_model"
          python main.py benchmark --model "$original_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/original-results.csv
          python main.py benchmark --model "$run20_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/run20-results.csv
          python main.py benchmark --model "$run22_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/run22-results.csv
          python main.py benchmark --model "$adaptive_model" --games 200 --depths 1 2 --seed 6000000 --output benchmarks/adaptive-results.csv
      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-model-benchmarks
          path: benchmarks/
          if-no-files-found: warn
          retention-days: 30
