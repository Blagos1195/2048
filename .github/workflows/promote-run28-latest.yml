name: Promote run28 latest checkpoint

on:
  push:
    paths:
      - ".github/workflows/promote-run28-latest.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download run28 training artifact
        uses: actions/download-artifact@v4
        with:
          name: slow-epsilon-max-length-training
          run-id: 41931505280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: run28-checkpoint
      - name: Promote latest to best and repository latest
        run: |
          test -s run28-checkpoint/latest.npz
          cp run28-checkpoint/latest.npz models/selfplay/best.npz
          cp run28-checkpoint/latest.npz models/selfplay/latest.npz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/selfplay/best.npz models/selfplay/latest.npz
          git commit -m "Promote run28 latest checkpoint"
          git push
