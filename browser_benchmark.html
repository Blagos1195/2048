<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pyodide engine benchmark</title></head>
<body>
<pre id="result">Loading Pyodide benchmark...</pre>
<script type="module">
const output = document.getElementById("result");
try {
  const module = await import("https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.mjs");
  const pyodide = await module.loadPyodide();
  await pyodide.loadPackage("numpy");
  const [sourceResponse, modelResponse] = await Promise.all([
    fetch("/selfplay_ai.py"),
    fetch("/best.npz")
  ]);
  if (!sourceResponse.ok || !modelResponse.ok) throw new Error("Could not load benchmark inputs");
  pyodide.FS.mkdirTree("/home/pyodide");
  pyodide.FS.writeFile("/home/pyodide/selfplay_ai.py", await sourceResponse.text());
  pyodide.FS.writeFile("/home/pyodide/best.npz", new Uint8Array(await modelResponse.arrayBuffer()));
  await pyodide.runPythonAsync(`
import sys, time, json
sys.path.insert(0, "/home/pyodide")
import selfplay_ai as ai
evaluator = ai.NTupleValue()
evaluator.load("/home/pyodide/best.npz")
game = ai.Game2048(5200000)
agent = ai.ExpectimaxAgent(evaluator, depth=2, seed=5200000, cache_size=12000)
started = time.perf_counter()
completed = 0
for _ in range(15):
    if not ai.can_move(game.board):
        break
    action = agent.choose_action(game.board.copy())
    changed, _, _ = game.step(action)
    if not changed:
        break
    completed += 1
elapsed = time.perf_counter() - started
result = {
    "runtime": "Pyodide in Chromium",
    "moves": completed,
    "seconds": elapsed,
    "ms_per_move": elapsed * 1000 / max(completed, 1),
    "score": game.score,
    "max_tile": game.max_tile
}
`);
  output.textContent = pyodide.globals.get("json").dumps(pyodide.globals.get("result"));
  output.dataset.complete = "true";
} catch (error) {
  output.textContent = String(error && error.stack || error);
  output.dataset.complete = "error";
}
</script>
</body>
</html>
