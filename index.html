<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 AI</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#514b45;background:#faf8ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
main{width:min(100%,480px)}header{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:clamp(42px,12vw,64px);line-height:1;margin:0;color:#776e65}.scores{display:flex;gap:8px}
.score{background:#bbada0;color:white;border-radius:6px;padding:7px 12px;text-align:center;min-width:82px;font-weight:700}
.score small{display:block;font-size:10px;letter-spacing:1px}.score span{font-size:19px}
p{line-height:1.45;color:#776e65}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:6px;background:#8f7a66;color:white;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer}
button.secondary{background:#bbada0}button:disabled{opacity:.5;cursor:wait}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:#bbada0;padding:9px;border-radius:8px;aspect-ratio:1;touch-action:pan-y}
.tile{display:flex;align-items:center;justify-content:center;border-radius:5px;background:#cdc1b4;color:#776e65;font-weight:800;font-size:clamp(22px,7vw,36px);min-width:0}
.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:white}.t16{background:#f59563;color:white}.t32{background:#f67c5f;color:white}.t64{background:#f65e3b;color:white}.t128,.t256,.t512{background:#edcf72;color:white;font-size:clamp(18px,5vw,29px)}.t1024,.t2048,.t4096{background:#edc53f;color:white;font-size:clamp(15px,4.5vw,25px)}
#status{min-height:24px;font-size:13px;color:#776e65;margin-top:10px}.note{font-size:12px;margin-top:16px;color:#8b8178}
@media(max-width:360px){#board{gap:6px;padding:6px}.tile{font-size:22px}}
</style></head>
<body><main>
<header><h1>2048</h1><div class="scores"><div class="score"><small>SCORE</small><span id="score">0</span></div><div class="score"><small>BEST</small><span id="best">0</span></div></div></header>
<p>Play yourself, or let your locally running AI choose the moves.</p>
<div id="board" aria-label="2048 game board"></div>
<div class="controls"><button id="new">New game</button><button id="ai">AI move</button><button id="auto" class="secondary">Auto-play: off</button></div>
<div id="status">Loading Python and the trained model…</div>
<p class="note">Use arrow keys or swipe to move. The AI runs in your browser. No training or game server is required.</p>
</main>
<script type="module">
import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.mjs";
const boardEl=document.getElementById("board"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),statusEl=document.getElementById("status");
const buttons=[...document.querySelectorAll("button")];let pyodide=null,ready=false,busy=false,autoplay=false,autoTimer=null,best=0,touchStart=null;
const say=s=>statusEl.textContent=s;
function draw(state){boardEl.innerHTML="";state.board.flat().forEach(v=>{const cell=document.createElement("div");cell.className="tile "+(v?"t"+v:"");cell.textContent=v||"";boardEl.appendChild(cell);});scoreEl.textContent=state.score.toLocaleString();best=Math.max(best,state.score);bestEl.textContent=best.toLocaleString();if(state.over){stopAuto();say("Game over. Start a new game to play again.");}}
async function pythonState(fn,arg){return JSON.parse(await pyodide.runPythonAsync(arg===undefined?fn+"()":fn+"("+arg+")"));}
async function humanMove(action){if(!ready||busy||autoplay)return;draw(await pythonState("browser_move",action));}
async function aiMove(){if(!ready||busy)return;busy=true;buttons.forEach(b=>b.disabled=true);say("Thinking…");try{const state=await pythonState("browser_ai_move");draw(state);if(!state.over)say("AI moved.");}catch(e){say("AI error: "+e.message);stopAuto();}finally{busy=false;buttons.forEach(b=>b.disabled=false);}}
function stopAuto(){autoplay=false;clearTimeout(autoTimer);document.getElementById("auto").textContent="Auto-play: off";}
function scheduleAuto(){if(!autoplay)return;autoTimer=setTimeout(async()=>{await aiMove();if(autoplay)scheduleAuto();},80);}
document.getElementById("new").addEventListener("click",async()=>{if(!ready||busy)return;stopAuto();draw(await pythonState("browser_new_game"));say("New game.");});
document.getElementById("ai").addEventListener("click",aiMove);
document.getElementById("auto").addEventListener("click",()=>{if(!ready)return;autoplay=!autoplay;document.getElementById("auto").textContent="Auto-play: "+(autoplay?"on":"off");if(autoplay)scheduleAuto();else clearTimeout(autoTimer);});
const keyMap={ArrowLeft:0,ArrowDown:1,ArrowRight:2,ArrowUp:3};
window.addEventListener("keydown",e=>{if(keyMap[e.key]!==undefined){e.preventDefault();humanMove(keyMap[e.key]);}});
boardEl.addEventListener("pointerdown",e=>{touchStart=[e.clientX,e.clientY];});
boardEl.addEventListener("pointerup",e=>{if(!touchStart)return;const dx=e.clientX-touchStart[0],dy=e.clientY-touchStart[1];touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;humanMove(Math.abs(dx)>Math.abs(dy)?(dx>0?2:0):(dy<0?3:1));});
async function start(){try{pyodide=await loadPyodide();await pyodide.loadPackage("numpy");const [sourceResponse,modelResponse]=await Promise.all([fetch("selfplay_ai.py"),fetch("models/selfplay/best.npz")]);if(!sourceResponse.ok)throw new Error("Could not load selfplay_ai.py ("+sourceResponse.status+")");if(!modelResponse.ok)throw new Error("Could not load models/selfplay/best.npz ("+modelResponse.status+")");pyodide.FS.writeFile("/home/pyodide/selfplay_ai.py",await sourceResponse.text());pyodide.FS.writeFile("/home/pyodide/best.npz",new Uint8Array(await modelResponse.arrayBuffer()));await pyodide.runPythonAsync(`
import sys, json
sys.path.insert(0, "/home/pyodide")
import selfplay_ai
_browser_evaluator = selfplay_ai.NTupleValue()
_browser_evaluator.load("/home/pyodide/best.npz")
_browser_agent = selfplay_ai.ExpectimaxAgent(_browser_evaluator, depth=1, seed=2048, cache_size=12000)
_browser_game = selfplay_ai.Game2048()
def _browser_state():
    return json.dumps({"board": _browser_game.board.astype(int).tolist(), "score": int(_browser_game.score), "over": not selfplay_ai.can_move(_browser_game.board)})
def browser_new_game():
    global _browser_game
    _browser_game = selfplay_ai.Game2048()
    return _browser_state()
def browser_move(action):
    _browser_game.step(int(action))
    return _browser_state()
def browser_ai_move():
    if not selfplay_ai.can_move(_browser_game.board):
        return _browser_state()
    action = _browser_agent.choose_action(_browser_game.board.copy())
    _browser_game.step(action)
    return _browser_state()
`);ready=true;buttons.forEach(b=>b.disabled=false);draw(await pythonState("browser_new_game"));say("Ready. Model loaded successfully.");}catch(e){say("Could not start: "+e.message);console.error(e);}}
buttons.forEach(b=>b.disabled=true);start();
</script></body></html>
