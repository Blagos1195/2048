<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#514b45;background:#faf8ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
main{width:min(100%,480px)}header{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:clamp(42px,12vw,64px);line-height:1;margin:0;color:#776e65}.scores{display:flex;gap:8px}
.score{background:#bbada0;color:white;border-radius:6px;padding:7px 12px;text-align:center;min-width:82px;font-weight:700}
.score small{display:block;font-size:10px;letter-spacing:1px}.score span{font-size:19px}
p{line-height:1.45;color:#776e65}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:6px;background:#8f7a66;color:white;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer}
button.secondary{background:#bbada0}button:disabled{opacity:.5;cursor:wait}
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:9px;background:#bbada0;padding:9px;border-radius:8px;width:100%;aspect-ratio:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.tile{display:flex;align-items:center;justify-content:center;border-radius:5px;background:#cdc1b4;color:#776e65;font-weight:800;font-size:clamp(22px,7vw,36px);min-width:0;min-height:0;overflow:hidden;white-space:nowrap}
.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:white}.t16{background:#f59563;color:white}.t32{background:#f67c5f;color:white}.t64{background:#f65e3b;color:white}.t128,.t256,.t512{background:#edcf72;color:white;font-size:clamp(18px,5vw,29px)}.t1024,.t2048,.t4096{background:#edc53f;color:white;font-size:clamp(15px,4.5vw,25px)}
#status{min-height:24px;font-size:13px;color:#776e65;margin-top:10px;text-align:center}.bottom{position:relative;min-height:34px;display:flex;align-items:center;justify-content:space-between}.tells{display:flex;align-items:center;gap:5px;position:absolute;right:0;bottom:2px}.tell{width:28px;height:30px;border:0;background:transparent;padding:0;display:grid;place-items:center;touch-action:manipulation}.tell i{display:block;width:4px;height:4px;border-radius:50%;background:#ddd5ca}.tell.active i{background:#82796f}.tell.ready i{background:#b4aa9b}.tell.ready.active i{background:#6e9b69}.overlay{display:none;position:fixed;inset:0;background:#0005;align-items:center;justify-content:center;padding:16px;z-index:5}.overlay.open{display:flex}.panel{width:min(100%,320px);background:#faf8ef;border:2px solid #bbada0;border-radius:10px;padding:18px;color:#776e65;box-shadow:0 8px 30px #0003}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h2{font-size:17px;margin:0}.panel button{padding:7px 11px}.panel p{margin:9px 0}.panel select{font:inherit;padding:8px;border:1px solid #bbada0;border-radius:5px;background:white;color:#514b45;width:100%}
@media(max-width:360px){#board{gap:6px;padding:6px}.tile{font-size:22px}}
</style>

</head>
<body><main>
<header><h1>2048</h1><div class="scores"><div class="score"><small>SCORE</small><span id="score">0</span></div><div class="score"><small>BEST</small><span id="best">0</span></div></div></header>
<p>Join the numbers and reach 2048.</p>
<div id="board" aria-label="2048 game board"></div>
<div class="controls"><button id="new">New Game</button><button id="stats" class="secondary">Your Stats</button></div>
<div class="bottom"><div id="status" aria-live="polite"></div></div>
<div class="overlay" id="game-overlay"><section class="panel"><h2 id="game-title">2048</h2><div id="game-message"></div><div class="controls"><button id="game-primary">Continue</button><button id="game-secondary" class="secondary">New Game</button></div></section></div><div class="overlay" id="overlay"><section class="panel"><div class="panel-head"><h2 id="panel-title">2048 STATS</h2><button id="close" class="secondary" aria-label="Close">×</button></div><div id="stats-content"><p>Games played: 0</p><p>Highest score: 0</p><p>Average score: 0</p><p>Highest tile: 2</p></div></section></div>
<p style="font-size:12px;margin-top:16px;color:#8b8178;text-align:center">Use the arrow keys or swipe to move.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const boardEl=$("board"),scoreEl=$("score"),bestEl=$("best"),statusEl=$("status");
let currentState=null,best=0,gameCount=0,totalScore=0,highestScore=0,highestTile=2;
let touchStart=null,recorded=false,wonShown=false,keepPlaying=false;
const say=s=>statusEl.textContent=s;
try{
 const saved=JSON.parse(localStorage.getItem("2048-player-stats")||"{}");
 gameCount=Number(saved.gamesPlayed)||0;totalScore=Number(saved.totalScore)||0;
 highestScore=Number(saved.highestScore)||0;highestTile=Number(saved.highestTile)||2;best=highestScore;
}catch(e){}
function saveGame(){
 if(!currentState)return;
 try{localStorage.setItem("2048-current-game",JSON.stringify({
  board:currentState.board,score:currentState.score,moves:currentState.moves,
  maxTile:currentState.maxTile,over:currentState.over,wonShown,keepPlaying
 }));}catch(e){}
}
function draw(state){
 const previous=[...boardEl.children].map((el,index)=>({
  value:Number(el.textContent)||0,
  x:index%4,y:Math.floor(index/4),
  rect:el.getBoundingClientRect(),used:false
 }));
 currentState=state;
 const fragment=document.createDocumentFragment();
 const targets=[];
 state.board.flat().forEach((value,index)=>{
  const cell=document.createElement("div");
  cell.className="tile "+(value?"t"+value:"");
  cell.textContent=value||"";
  fragment.appendChild(cell);
  if(value)targets.push({value,x:index%4,y:Math.floor(index/4),cell});
 });
 boardEl.replaceChildren(fragment);
 for(const target of targets){
  let source=null,bestDistance=Infinity;
  for(const candidate of previous){
   if(candidate.used||candidate.value!==target.value)continue;
   const distance=Math.abs(candidate.x-target.x)+Math.abs(candidate.y-target.y);
   if(distance<bestDistance){source=candidate;bestDistance=distance;}
  }
  if(!source)continue;
  source.used=true;
  const dx=source.rect.left-target.cell.getBoundingClientRect().left;
  const dy=source.rect.top-target.cell.getBoundingClientRect().top;
  if(dx||dy){
   target.cell.style.transition="none";
   target.cell.style.transform="translate("+dx+"px,"+dy+"px)";
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
    target.cell.style.transition="transform 105ms ease-in-out";
    target.cell.style.transform="translate(0,0)";
   }));
  }
 }
 scoreEl.textContent=state.score.toLocaleString();
 best=Math.max(best,state.score);highestScore=Math.max(highestScore,state.score);
 highestTile=Math.max(highestTile,state.maxTile||2);
 bestEl.textContent=Math.max(best,highestScore).toLocaleString();
 try{localStorage.setItem("2048-player-stats",JSON.stringify({gamesPlayed:gameCount,totalScore,highestScore,highestTile}));}catch(e){}
 saveGame();
 if(state.over){recordGame();say("Game over. Start a new game to play again.");}
}
function spawnTile(board){
 const empty=[];
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!board[r][c])empty.push([r,c]);
 if(!empty.length)return;
 const [r,c]=empty[Math.floor(Math.random()*empty.length)];
 board[r][c]=Math.random()<0.1?4:2;
}
function jsMove(state,action){
 const board=state.board.map(row=>row.slice());let gained=0,changed=false;
 for(let n=0;n<4;n++){
  const coords=[];
  for(let k=0;k<4;k++){
   let r,c;
   if(action===0){r=n;c=k;}else if(action===2){r=n;c=3-k;}
   else if(action===3){r=k;c=n;}else{r=3-k;c=n;}
   coords.push([r,c]);
  }
  const vals=coords.map(([r,c])=>board[r][c]).filter(Boolean),merged=[];
  for(let i=0;i<vals.length;i++){
   if(vals[i]===vals[i+1]){const v=vals[i]*2;merged.push(v);gained+=v;i++;}
   else merged.push(vals[i]);
  }
  while(merged.length<4)merged.push(0);
  coords.forEach(([r,c],i)=>{if(board[r][c]!==merged[i])changed=true;board[r][c]=merged[i];});
 }
 if(!changed)return state;
 spawnTile(board);
 const maxTile=Math.max(...board.flat()),moves=state.moves+1,score=state.score+gained;
 let canMove=false;
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  if(!board[r][c]||(r<3&&board[r][c]===board[r+1][c])||(c<3&&board[r][c]===board[r][c+1]))canMove=true;
 }
 return {board,score,moves,maxTile,over:!canMove};
}
function recordGame(){
 if(recorded||!currentState||!currentState.moves)return;
 recorded=true;gameCount++;totalScore+=currentState.score;
 highestScore=Math.max(highestScore,currentState.score);
 highestTile=Math.max(highestTile,currentState.maxTile);
 try{localStorage.setItem("2048-player-stats",JSON.stringify({gamesPlayed:gameCount,totalScore,highestScore,highestTile}));}catch(e){}
}
function showGameOverlay(title,message,primary,secondary,primaryAction,secondaryAction){
 $("game-title").textContent=title;$("game-message").textContent=message;
 $("game-primary").textContent=primary;$("game-secondary").textContent=secondary;
 $("game-primary").onclick=()=>{$("game-overlay").classList.remove("open");primaryAction();};
 $("game-secondary").onclick=()=>{$("game-overlay").classList.remove("open");secondaryAction();};
 $("game-overlay").classList.add("open");
}
function renderState(state){
 draw(state);
 if(state.maxTile>=2048&&!wonShown&&!keepPlaying){
  wonShown=true;
  showGameOverlay("You win!","You reached 2048.","Keep playing","New Game",
   ()=>{keepPlaying=true;say("Keep going!");},()=>startNewGame(true));
 }
 if(state.over){
  recordGame();
  showGameOverlay("Game over!","Final score: "+state.score.toLocaleString(),
   "New Game","Close",()=>startNewGame(true),()=>{});
 }
}
function humanMove(action){
 if(!currentState||currentState.over||$("game-overlay").classList.contains("open"))return;
 const next=jsMove(currentState,action);
 if(next!==currentState){renderState(next);if(!next.over)say(" "); }
}
async function startNewGame(confirmed=false){
 if(!confirmed&&currentState&&currentState.moves>0&&!currentState.over){
  showGameOverlay("Start a new game?","Your current game will be ended.",
   "Restart","Cancel",()=>startNewGame(true),()=>{});
  return;
 }
 recordGame();recorded=false;wonShown=false;keepPlaying=false;
 const board=Array.from({length:4},()=>[0,0,0,0]);
 spawnTile(board);spawnTile(board);
 renderState({board,score:0,moves:0,maxTile:Math.max(...board.flat()),over:false});
 say(" ");
}
function openStats(){
 const avg=gameCount?totalScore/gameCount:0;
 $("stats-content").innerHTML="<p>Games played: "+gameCount+"</p><p>Highest score: "+highestScore+"</p><p>Average score: "+avg.toFixed(1)+"</p><p>Highest tile: "+highestTile+"</p>";
 $("overlay").classList.add("open");
}
$("new").addEventListener("click",()=>startNewGame(false));
$("stats").addEventListener("click",openStats);
$("close").addEventListener("click",()=>$("overlay").classList.remove("open"));
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")e.currentTarget.classList.remove("open");});
$("game-overlay").addEventListener("click",e=>{if(e.target.id==="game-overlay")e.currentTarget.classList.remove("open");});
const keyMap={ArrowLeft:0,ArrowDown:1,ArrowRight:2,ArrowUp:3};
window.addEventListener("keydown",e=>{
 if($("game-overlay").classList.contains("open"))return;
 if(e.key.toLowerCase()==="r"){startNewGame(false);e.preventDefault();return;}
 if(keyMap[e.key]!==undefined){e.preventDefault();humanMove(keyMap[e.key]);}
});
boardEl.addEventListener("pointerdown",e=>{touchStart=[e.clientX,e.clientY];});
boardEl.addEventListener("pointerup",e=>{
 if(!touchStart)return;
 const dx=e.clientX-touchStart[0],dy=e.clientY-touchStart[1];touchStart=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
 humanMove(Math.abs(dx)>Math.abs(dy)?(dx>0?2:0):(dy<0?3:1));
});
function start(){
 let saved=null;
 try{
  saved=JSON.parse(localStorage.getItem("2048-current-game")||"null");
  if(!saved||!Array.isArray(saved.board)||saved.board.length!==4||
   saved.board.some(row=>!Array.isArray(row)||row.length!==4))saved=null;
 }catch(e){}
 if(saved){
  wonShown=!!saved.wonShown;keepPlaying=!!saved.keepPlaying;
  renderState({board:saved.board,score:Number(saved.score)||0,moves:Number(saved.moves)||0,
   maxTile:Number(saved.maxTile)||Math.max(...saved.board.flat()),over:!!saved.over});
  say(saved.over?"Game over.":" ");
 }else{
  const board=Array.from({length:4},()=>[0,0,0,0]);spawnTile(board);spawnTile(board);
  renderState({board,score:0,moves:0,maxTile:Math.max(...board.flat()),over:false});
  say(" ");
 }
}
start();
</script></body></html>
